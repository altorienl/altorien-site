# The front page. Its own Worker, not a path on another one: every project here
# is a separate origin, so a bug in any of them cannot reach another's cookies,
# localStorage or install identity.
name = "altorien"
compatibility_date = "2026-10-30"

# Top-level, like workers_dev, and for the same reason: a bare key placed
# after a [[routes]] table is parsed as part of that table. This one got
# absorbed into the www route and wrangler rejected the file.
main = "src/index.js"

# Explicit, and for the reason fly-with-friends learned the hard way: adding a
# [[routes]] block turns the workers.dev hostname off by default. It must stay
# ABOVE the route tables -- a bare key after [[routes]] is parsed as part of
# that table, and wrangler rejects the file.
workers_dev = true

# The apex and www, now that altorien.com is on Cloudflare nameservers. Until
# today this Worker had no route and the domain served a GoDaddy parking
# lander, which is a worse front page than no front page.
[[routes]]
pattern = "altorien.com"
custom_domain = true

[[routes]]
pattern = "www.altorien.com"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
# Without this, a matching asset is served BEFORE the Worker runs, so the
# Worker never sees a request for "/" and the www->apex redirect in
# src/index.js is dead code that tests green locally and does nothing in
# production. The Worker forwards everything it does not handle straight to
# env.ASSETS, so running it first costs one function call per request and
# buys the redirect actually happening.
run_worker_first = true
